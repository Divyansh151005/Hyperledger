networks:
  medical-network:
    name: medical-network

services:
  orderer0.medical-network.com:
    container_name: orderer0.medical-network.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_CLUSTER_LISTENPORT=7051
      - ORDERER_GENERAL_CLUSTER_SERVERCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_SERVERPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
    command: orderer
    volumes:
      - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/tls:/var/hyperledger/orderer/tls
      - ../../data/orderer0:/var/hyperledger/production
    ports:
      - "7050:7050"
      - "8443:8443"
    networks:
      - medical-network

  peer0.hospital1.medical-network.com:
    container_name: peer0.hospital1.medical-network.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital1.medical-network.com
      - CORE_PEER_ADDRESS=peer0.hospital1.medical-network.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital1.medical-network.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital1.medical-network.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital1.medical-network.com:7051
      - CORE_PEER_GOSSIP_ENDPOINT=peer0.hospital1.medical-network.com:7051
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_LOCALMSPID=HospitalMSP1
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=medical-network
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    command: peer node start
    volumes:
      - ../config/core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com:/etc/hyperledger/fabric
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/users:/etc/hyperledger/fabric/users
      - ../channel-artifacts:/etc/hyperledger/configtx
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/tls/ca.crt:/etc/hyperledger/orderer-tls/ca.crt
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital1/ca.crt
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital2/ca.crt
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/research/ca.crt
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/regulator/ca.crt
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../chaincode:/opt/gopath/src/github.com/chaincode
      - ../../data/peer0.hospital1:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - medical-network

  peer0.hospital2.medical-network.com:
    container_name: peer0.hospital2.medical-network.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital2.medical-network.com
      - CORE_PEER_ADDRESS=peer0.hospital2.medical-network.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital2.medical-network.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital2.medical-network.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital2.medical-network.com:7051
      - CORE_PEER_GOSSIP_ENDPOINT=peer0.hospital2.medical-network.com:7051
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_LOCALMSPID=HospitalMSP2
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=medical-network
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    command: peer node start
    volumes:
      - ../config/core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com:/etc/hyperledger/fabric
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/users:/etc/hyperledger/fabric/users
      - ../channel-artifacts:/etc/hyperledger/configtx
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/tls/ca.crt:/etc/hyperledger/orderer-tls/ca.crt
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital1/ca.crt
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital2/ca.crt
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/research/ca.crt
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/regulator/ca.crt
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../chaincode:/opt/gopath/src/github.com/chaincode
      - ../../data/peer0.hospital2:/var/hyperledger/production
    ports:
      - "9051:7051"
    networks:
      - medical-network

  peer0.research.medical-network.com:
    container_name: peer0.research.medical-network.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.research.medical-network.com
      - CORE_PEER_ADDRESS=peer0.research.medical-network.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.research.medical-network.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.research.medical-network.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.research.medical-network.com:7051
      - CORE_PEER_GOSSIP_ENDPOINT=peer0.research.medical-network.com:7051
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_LOCALMSPID=ResearchOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=medical-network
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    command: peer node start
    volumes:
      - ../config/core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com:/etc/hyperledger/fabric
      - ../crypto-config/peerOrganizations/research.medical-network.com/users:/etc/hyperledger/fabric/users
      - ../channel-artifacts:/etc/hyperledger/configtx
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/tls/ca.crt:/etc/hyperledger/orderer-tls/ca.crt
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital1/ca.crt
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital2/ca.crt
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/research/ca.crt
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/regulator/ca.crt
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../chaincode:/opt/gopath/src/github.com/chaincode
      - ../../data/peer0.research:/var/hyperledger/production
    ports:
      - "10051:7051"
    networks:
      - medical-network

