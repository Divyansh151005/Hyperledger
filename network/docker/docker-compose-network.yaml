      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.medical-network.com
      - CORE_PEER_ADDRESS=peer0.regulator.medical-network.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.medical-network.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.medical-network.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.medical-network.com:7051
      - CORE_PEER_GOSSIP_ENDPOINT=peer0.regulator.medical-network.com:7051
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=medical-network
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    command: peer node start
    volumes:
      - ../config/core.yaml:/etc/hyperledger/peercfg/core.yaml
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com:/etc/hyperledger/fabric
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/users:/etc/hyperledger/fabric/users
