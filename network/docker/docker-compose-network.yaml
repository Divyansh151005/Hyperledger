      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital2/ca.crt
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/research/ca.crt
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/regulator/ca.crt
      - /var/run/docker.sock:/host/var/run/docker.sock
