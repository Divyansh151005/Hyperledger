      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/peers/peer0.hospital1.medical-network.com/tls/:/etc/hyperledger/fabric/tls
      - ../crypto-config/peerOrganizations/hospital1.medical-network.com/users:/etc/hyperledger/fabric/users
      - ../channel-artifacts:/etc/hyperledger/configtx
      - ../crypto-config/ordererOrganizations/medical-network.com/orderers/orderer0.medical-network.com/tls/ca.crt:/etc/hyperledger/orderer-tls/ca.crt
      - ../crypto-config/peerOrganizations/hospital2.medical-network.com/peers/peer0.hospital2.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/hospital2/ca.crt
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/research/ca.crt
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/peers/peer0.regulator.medical-network.com/tls/ca.crt:/etc/hyperledger/peer-tls/regulator/ca.crt
      - ${HOME}/.docker/run/docker.sock:/host/var/run/docker.sock
      - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/opt/chaincode-package
      - ../external-builder:/opt/hyperledger/external-builder
      - ../../chaincode/medical-records/collections_config.json:/tmp/collections_config.json
      - ../../data/peer0.hospital1:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "12051:7051"
      - "9444:9443"
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "peer", "node", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

