      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/research.medical-network.com/peers/peer0.research.medical-network.com/tls/:/etc/hyperledger/fabric/tls
