  medicalcc:
    container_name: medicalcc
    image: node:18-alpine
    working_dir: /chaincode
    environment:
      - CORE_CHAINCODE_ID_NAME=medicalcc
    volumes:
      - ../../chaincode/medical-records:/chaincode
    command: >
      sh -c "
      npm install &&
      npm start -- --peer.address=peer0.regulator.medical-network.com:7052
      "
    networks:
      - medical-network
