networks:
  medical-network:
    name: medical-network

services:
  # Regulator CA
  ca.regulator.medical-network.com:
    image: hyperledger/fabric-ca:1.5.3
    container_name: ca.regulator.medical-network.com
    platform: linux/amd64
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server-config
      - FABRIC_CA_SERVER_CA_NAME=ca-regulator
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7054:7054"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-config/peerOrganizations/regulator.medical-network.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "fabric-ca-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Hospital 1 CA
  ca.hospital1.medical-network.com:
