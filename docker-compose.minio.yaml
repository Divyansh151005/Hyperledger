# MinIO for medical record file storage
# Run: docker-compose -f docker-compose.minio.yaml up -d
version: '3.8'
services:
  minio:
    image: minio/minio:latest
    container_name: minio-medical
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
volumes:
  minio-data:
